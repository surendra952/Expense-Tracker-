<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense Tracker</h1>
    </header>

    <!-- Dashboard Summary -->
    <section class="dashboard">
      <div class="card balance-card">
        <h3>Total Balance</h3>
        <p id="total-balance" class="amount">₹0.00</p>
      </div>
      <div class="card income-card">
        <h3>Total Income</h3>
        <p id="total-income" class="amount">₹0.00</p>
      </div>
      <div class="card expense-card">
        <h3>Total Expenses</h3>
        <p id="total-expense" class="amount">₹0.00</p>
      </div>
    </section>

    <!-- Add Transaction Form -->
    <section class="form-container">
      <h2>Add New Transaction</h2>
      <div id="error-message" class="error-message hidden"></div>
      <form id="transaction-form" novalidate>
        <div class="form-control">
          <label for="name">Transaction Name</label>
          <input type="text" id="name" placeholder="e.g., Grocery Shopping, Salary" required>
        </div>
        
        <div class="form-control">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
        </div>

        <div class="form-control">
          <label for="type">Type</label>
          <select id="type" required>
            <option value="" disabled selected>Select transaction type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <button type="submit" class="btn">Add Transaction</button>
      </form>
    </section>

    <!-- Transaction History -->
    <section class="history-container">
      <h2>Transaction History</h2>
      <div class="table-responsive">
        <table class="history-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Amount</th>
              <th>Type</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
            <!-- Transactions will be dynamically added here -->
          </tbody>
        </table>
        <p id="empty-state" class="empty-state">No transactions added yet.</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
